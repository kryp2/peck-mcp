<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .bg    { fill: #F5F1E9; }
      .panel { fill: #EAE5DB; }
      .dark  { fill: #1C1916; }
      .ink      { fill: #2C2722; }
      .ink-soft { fill: #5A5149; }
      .ink-mute { fill: #807668; }
      .rule     { stroke: #D8CFC0; stroke-width: 1.5; fill: none; }
      .accent   { fill: #B8733C; }
      .accent-on-dark { fill: #D89C62; }
      .on-deep  { fill: #E6DFD2; }
      .on-deep-mute { fill: #918877; }
      .serif        { font-family: "Instrument Serif", Georgia, "Times New Roman", serif; font-weight: 400; }
      .serif-italic { font-family: "Instrument Serif", Georgia, "Times New Roman", serif; font-style: italic; font-weight: 400; }
      .sans         { font-family: "Inter Tight", "Inter", "Helvetica Neue", Arial, sans-serif; font-weight: 500; }
      .mono         { font-family: "JetBrains Mono", "Menlo", "Consolas", monospace; font-weight: 500; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1200" height="630"/>

  <!-- Top rule + brand lockup -->
  <line class="rule" x1="56" y1="86" x2="1144" y2="86"/>

  <!-- Brand mark + wordmark -->
  <rect x="56" y="38" width="38" height="38" rx="6" class="dark"/>
  <text x="65.5" y="70" font-size="30" class="serif-italic on-deep">P</text>

  <text x="108" y="66" font-size="18" class="mono ink">peck</text>
  <text x="158" y="66" font-size="18" class="mono ink-mute">/</text>
  <text x="175" y="66" font-size="20" class="serif-italic accent">mcp</text>

  <!-- Top-right: version chip -->
  <text x="1144" y="66" font-size="12" class="mono ink-mute" text-anchor="end">v0.4.1 · npm · open bsv v5</text>

  <!-- Meta label -->
  <text x="56" y="130" font-size="11" class="mono ink-mute" letter-spacing="1.5">00 · MODEL CONTEXT PROTOCOL FOR BSV</text>

  <!-- Headline (3 lines, serif, huge) -->
  <text x="56" y="210" font-size="76" class="serif-italic accent">Give</text>
  <text x="180" y="210" font-size="76" class="serif ink">any LLM a BSV wallet,</text>

  <text x="56" y="290" font-size="76" class="serif-italic ink">an on-chain identity,</text>

  <text x="56" y="370" font-size="76" class="serif ink">and a</text>
  <text x="228" y="370" font-size="76" class="serif-italic accent">social graph.</text>

  <!-- Lede -->
  <text x="56" y="430" font-size="19" class="sans ink-soft">38 MCP tools · keys in your OS keychain · npm-installable · same chain as peck.to + 50 other apps</text>

  <!-- Install command bar -->
  <rect x="56" y="470" width="790" height="70" rx="10" class="dark"/>
  <text x="76" y="512" font-size="15" class="mono on-deep-mute">$</text>
  <text x="96" y="512" font-size="16" class="mono on-deep">npm install -g </text>
  <text x="260" y="512" font-size="16" class="mono accent-on-dark">peck-mcp</text>
  <text x="826" y="512" font-size="12" class="mono on-deep-mute" text-anchor="end" letter-spacing="1.5">COPY</text>

  <!-- Right-aligned footer: stats -->
  <line class="rule" x1="56" y1="560" x2="1144" y2="560"/>

  <text x="56" y="592" font-size="11" class="mono ink-mute" letter-spacing="1.5">38 TOOLS</text>
  <text x="175" y="592" font-size="11" class="mono ink-mute" letter-spacing="1.5">·  51 APPS</text>
  <text x="295" y="592" font-size="11" class="mono ink-mute" letter-spacing="1.5">·  2.5M+ POSTS</text>
  <text x="440" y="592" font-size="11" class="mono ink-mute" letter-spacing="1.5">·  BSV MAINNET</text>
  <text x="1144" y="592" font-size="11" class="mono ink-mute" text-anchor="end" letter-spacing="1.5">MCP.PECK.TO</text>
</svg>
